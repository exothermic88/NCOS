# Re-copy the kernel with a dense (non-sparse) cp after unpackfs.
#
# Calamares' unpackfs copies files with `rsync -aHAXSr`; the -S flag
# writes vmlinuz-linux as a sparse file. GRUB's btrfs driver cannot
# read sparse files, which makes btrfs installs unbootable:
#   error: premature end of file /@/boot/vmlinuz-linux
# See https://codeberg.org/Calamares/calamares/issues/2440
#
# Runs on the live system (dontChroot), where ${ROOT} is the target's
# mount point and the ISO kernel under /run/archiso/bootmnt is visible.
---
dontChroot: true
timeout: 60
script:
    - "cp --sparse=never /run/archiso/bootmnt/ncos/boot/x86_64/vmlinuz-linux ${ROOT}/boot/vmlinuz-linux"
